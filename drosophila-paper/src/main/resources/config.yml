# ==============================================================================
#                      🪰 FRUITFLY CONFIGURATION / YAPILANDIRMASI
#    MaleCNS v1.0 Biological Connectome Interface for Minecraft Paper/Spigot
# ==============================================================================
# This configuration file defines the biological parameters, localization,
# WebSocket bridge server, and physical behaviors of the Fruit Fly entity.
#
# Changes take effect after server restart or '/reload'.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. LANGUAGE / LOCALIZATION
# ------------------------------------------------------------------------------
# [OPTIONAL] - Default: "en"
# Active language for in-game commands, entity name, messages, and telemetry.
#
# Options:
#   "en" -> English (Default)
#   "tr" -> Türkçe
#
# Custom Languages:
#   Add your custom language file under 'plugins/FruitFly/languages/'
#   (e.g., messages_de.yml, messages_es.yml) and set its code here.
#   Missing keys will safely fallback to English ("en").
language: "en"

# ------------------------------------------------------------------------------
# 2. PYTHON BRAIN WEBSOCKET SERVER / BEYİN BAĞLANTISI
# ------------------------------------------------------------------------------
# The Minecraft plugin runs a high-performance WebSocket server.
# The Python MaleCNS connectome engine connects to this server.
brain:

  # [REQUIRED] - Default: 8765
  # TCP Port to listen for Python brain connections.
  # Open this port in your firewall if Python runs on a separate machine.
  port: 8765

  # [REQUIRED] - Default: "drosophila_secret_token_123"
  # Security Authentication Secret / Password.
  # MUST match the FLY_AUTH_TOKEN / auth_token in Python's config.json / .env.
  auth-token: "drosophila_secret_token_123"

  # [OPTIONAL] Smart Sleep Mode (Circadian LOD / Güç Tasarrufu)
  smart-sleep:
    # [OPTIONAL] - Default: false
    # false -> Fly stays active 24/7 exploring the world (Recommended).
    # true  -> When no players are nearby, sensory raytracing is paused (virtually 0% CPU usage).
    enabled: false

    # [OPTIONAL] - Default: 48.0
    # Player distance threshold (blocks). If all players are farther than this
    # and safety conditions are met, the fly enters resting mode.
    # Safety rules: NEVER sleeps if monsters/threats are near, light changes,
    # loud sound is heard, or health is low.
    player-distance: 48.0

# ------------------------------------------------------------------------------
# 3. FRUIT FLY ENTITY SETTINGS / VARLIK AYARLARI
# ------------------------------------------------------------------------------
bee:

  # [OPTIONAL] - Default: true
  # AUTO-SPAWN & RESPAWN:
  #   true  -> Automatically spawns when server starts and respawns 2s after death.
  #   false -> Only spawns when an admin calls '/fruitfly come' or '/fruitfly home'.
  auto-spawn: true

  # [OPTIONAL] - Default: "" (Empty)
  # Custom display name above fly. Supports color codes (e.g. '&e', '&a', '&6').
  # If left empty (""), dynamically uses the localized name from messages file.
  display-name: ""

  # [OPTIONAL] - Default: false
  # INVULNERABILITY (God Mode):
  #   false -> Realistic biology; susceptible to lava, drowning, monsters. Escapes via Giant Fiber (DNp01).
  #   true  -> Fly cannot be damaged or killed.
  invulnerable: false

  # [OPTIONAL] - Default: 1.0
  # Flight Speed Multiplier:
  #   1.0 = Natural biological cruising speed.
  #   1.3 = Fast exploration mode.
  #   0.7 = Slow, calm observation mode.
  speed-multiplier: 1.0

  # [OPTIONAL] - Default: 16.0
  # Olfactory Odor Detection Radius (Blocks):
  # Maximum distance the fly can detect apples, sugar, flowers, and tree leaves.
  odor-range: 16.0

  # [SAVED AUTOMATICALLY] Home Spawnpoint:
  # Automatically saved when '/fruitfly spawnpoint' is used in-game.
  # Reset with: '/fruitfly spawnpoint clear'

# ------------------------------------------------------------------------------
# 4. COMPOUND EYE VISION / PETEK GÖZ
# ------------------------------------------------------------------------------
# Raytraces the Minecraft world with 64 cols x 24 rows = 1536 ommatidia.
vision:

  # [OPTIONAL] - Default: 16.0
  # Maximum visual distance for obstacles and hazards (blocks).
  max-ray-range: 16.0
