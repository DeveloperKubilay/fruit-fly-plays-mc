# ==============================================================================
#                      🪰 FRUITFLY YAPILANDIRMASI
#    MaleCNS v1.0 Biological Connectome Interface for Minecraft Paper/Spigot
# ==============================================================================
# Bu dosya sineğin biyolojik parametrelerini, dilini, WebSocket sunucusunu
# ve Minecraft dünyasındaki davranışlarını yapılandırır.
#
# Ayarların yanında [ZORUNLU] veya [OPSİYONEL] olduğu ve [VARSAYILAN] değeri belirtilmiştir.
# Değişikliklerin geçerli olması için sunucuyu yeniden başlatmanız gerekir.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DİL AYARI / LOCALIZATION
# ------------------------------------------------------------------------------
# [OPSİYONEL] - Varsayılan: "en"
# Oyun içi komutlar, sinek ismi, şişe eşyası ve durum telemetrisi için aktif dil.
#
# Seçenekler:
#   "en" -> English (Varsayılan)
#   "tr" -> Türkçe
#
# Özel Dil Ekleme:
#   'plugins/FruitFly/languages/' klasörüne dilediğiniz dilde dosya ekleyebilirsiniz
#   (örn: messages_de.yml, messages_es.yml) ve kodunu buraya yazabilirsiniz.
#   Eğer özel dil dosyanızda eksik bir anahtar kalırsa sistem çökmez,
#   otomatik olarak İngilizce ("en") karşılığını kullanır (Fallback).
language: "en"

# ------------------------------------------------------------------------------
# 2. PYTHON BEYİN BAĞLANTISI / BRAIN WEBSOCKET SERVER
# ------------------------------------------------------------------------------
# Minecraft Paper eklentisi bir WebSocket sunucusu açar.
# Python tarafındaki MaleCNS beyin simülasyonu ('start.sh') bu sunucuya bağlanır.
brain:

  # [ZORUNLU] - Varsayılan: 8765
  # Eklentinin dinleyeceği TCP portu.
  # ÖNEMLİ: Python tarafındaki 'start.sh' veya köprü bu porta bağlanır.
  # Python ile Minecraft aynı makinedeyse yereldir. Farklı makinelerdeyse
  # güvenlik duvarınızdan (firewall) bu porta izin verilmelidir.
  port: 8765

  # [ZORUNLU] - Varsayılan: "drosophila_secret_token_123"
  # Güvenlik Anahtarı (Authentication Secret).
  # Yetkisiz kişilerin veya botların porta bağlanıp sineği ele geçirmesini önler.
  # ÖNEMLİ: Python tarafındaki token ile buradaki değer BİREBİR AYNI olmalıdır.
  auth-token: "drosophila_secret_token_123"

  # [OPSİYONEL] Akıllı Dinlenme Modu (Smart Sleep / Circadian LOD)
  smart-sleep:
    # [OPSİYONEL] - Varsayılan: false
    # false -> Sinek 7/24 uyanık kalır, sürekli dünyayı gezer ve yaşar (Tavsiye edilen).
    # true  -> Etrafta hiç oyuncu yoksa duyusal ışın izleme durdurulur (0 CPU tasarrufu).
    enabled: false

    # [OPSİYONEL] - Varsayılan: 48.0
    # Oyuncu mesafe eşiği (blok). Eğer bütün oyuncular bu mesafeden uzaktaysa
    # ve 4 güvenlik şartı sağlanıyorsa sinek uyku moduna geçer.
    # Güvenlik kuralları: Canavar/tehdit varsa, ışık değişirse, yüksek ses duyulursa
    # veya sineğin canı azsa ASLA UYUMAZ.
    player-distance: 48.0

# ------------------------------------------------------------------------------
# 3. MEYVE SİNEĞİ VARLIK AYARLARI / ENTITY SETTINGS
# ------------------------------------------------------------------------------
bee:

  # [OPSİYONEL] - Varsayılan: true
  # OTOMATİK DOĞMA VE DİRİLME (Auto-Spawn):
  #   true  -> Sunucu her açıldığında sinek otomatik olarak evinde (veya spawn'da) doğar.
  #            Ayrıca sinek lav, kaktüs vb. sebeplerle ölürse 2 saniye sonra otomatik dirilir.
  #            (Sineğin sunucuda 7/24 yaşayan bağımsız bir canlı olması için ideal moddur)
  #   false -> Sinek sunucu açıldığında KENDİLİĞİNDEN DOĞMAZ ve ölürse otomatik dirilmez.
  #            Sadece bir yönetici oyundan '/fruitfly come' veya '/fruitfly home'
  #            yazdığında sahneye çağrılır.
  auto-spawn: true

  # [OPSİYONEL] - Varsayılan: "" (Boş)
  # Sineğin kafasının üstünde gözükecek özel isim.
  # Renk kodları desteklenir (örn: '&e', '&a', '&6').
  # Eğer BOŞ bırakılırsa (""), seçilen dil dosyasındaki isim dinamik kullanılır:
  #   language: "en" ise -> "Fruit Fly"
  #   language: "tr" ise -> "Meyve Sineği"
  # Özel isim örneği: "&6Drosophila &7[MaleCNS]"
  display-name: ""

  # [OPSİYONEL] - Varsayılan: false
  # ÖLÜMSÜZLÜK / DOKUNULMAZLIK (God Mode):
  #   false -> Sinek gerçekçi biyolojiye sahiptir; lav, düşme, boğulma veya mob saldırısıyla
  #            hasar alabilir. Tehlike anında DNp01 dev nöron kaçış refleksiyle kaçar.
  #   true  -> Sinek hiçbir şekilde hasar almaz, vurulamaz ve ölemez.
  invulnerable: false

  # [OPSİYONEL] - Varsayılan: 1.0
  # Uçuş Hızı Çarpanı (Speed Multiplier):
  #   1.0 = Doğal biyolojik böcek seyir hızı (Gerçekçi hız).
  #   1.3 = Daha seri ve hızlı keşif modu.
  #   0.7 = Yavaş, gözlem amaçlı sakin süzülme.
  speed-multiplier: 1.0

  # [OPSİYONEL] - Varsayılan: 16.0
  # Koku Algılama Menzili (Odor Detection Radius - Blok):
  # Sineğin yerdeki elmaları, şeker kaynaklarını, çiçekleri ve ağaç yapraklarını
  # algılayabildiği maksimum koku mesafesi.
  odor-range: 16.0

  # [OTOMATİK KAYDEDİLİR] Kalıcı Doğma Noktası (Home Spawnpoint):
  # Bu alanı elle doldurmanıza gerek yoktur!
  # Oyunda istediğiniz konuma gidip '/fruitfly spawnpoint' yazdığınızda koordinatlar
  # buraya otomatik yazılır ve sunucu yeniden başlasa bile korunur.
  # Sıfırlamak için: '/fruitfly spawnpoint clear'
  # Örnek kaydedilmiş çıktı:
  # spawnpoint:
  #   world: "world"
  #   x: 105.5
  #   y: 68.0
  #   z: -214.5
  #   yaw: 180.0
  #   pitch: 0.0

# ------------------------------------------------------------------------------
# 4. PETEK GÖZ IŞIN İZLEME / COMPOUND EYE RAYTRACING
# ------------------------------------------------------------------------------
# Sinek Minecraft dünyasını doğal biyolojisine uygun olarak 64 sütun x 24 satır
# = 1536 ommatidium (petek göz merceği) ile tarar ve MaleCNS optik lobuna aktarır.
vision:

  # [OPSİYONEL] - Varsayılan: 16.0
  # Petek gözün görebildiği maksimum engel ve tehdit mesafesi (blok).
  max-ray-range: 16.0
