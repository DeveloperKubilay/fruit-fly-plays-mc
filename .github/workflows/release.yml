name: Release

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: Release version (e.g. 1.0.0)
        required: true
        type: string
        default: '1.0.0'
      prerelease:
        description: Publish as prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: vars
        shell: bash
        run: |
          raw_version="${{ github.event.inputs.version_number }}"
          version_number="${raw_version#v}"

          if [[ ! "$version_number" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "Invalid version_number: $version_number"
            exit 1
          fi

          prerelease="${{ github.event.inputs.prerelease }}"
          if [[ "$prerelease" != "true" ]]; then
            prerelease="false"
          fi

          echo "version_number=$version_number" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version_number}" >> "$GITHUB_OUTPUT"
          echo "release_title=Drosophila v${version_number}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Minecraft Server Plugin (Paper / Spigot)
        shell: bash
        run: |
          ver="${{ steps.vars.outputs.version_number }}"
          mkdir -p dist

          echo "Building DrosophilaBee JAR with Maven..."
          mvn -B clean package --file drosophila-paper/pom.xml

          target_jar="drosophila-paper/target/DrosophilaBee.jar"
          if [[ ! -f "$target_jar" ]]; then
            echo "Error: $target_jar not found!"
            exit 1
          fi

          cp "$target_jar" "dist/DrosophilaBee-v${ver}.jar"

          echo "Plugin build successful:"
          ls -lh dist/*.jar

      - name: Package Python Connectome Brain Simulation
        shell: bash
        run: |
          ver="${{ steps.vars.outputs.version_number }}"
          pkg_name="drosophila-brain-v${ver}"
          mkdir -p "$pkg_name"

          cp run_real.py "$pkg_name/"
          cp fly_brain_real.py "$pkg_name/"
          cp connectome_loader.py "$pkg_name/"
          cp minecraft_real_bridge.py "$pkg_name/"
          cp fly_sound.py "$pkg_name/"
          cp fly_log.py "$pkg_name/"
          cp dogrula.py "$pkg_name/"
          cp requirements.txt "$pkg_name/"
          cp setup.sh "$pkg_name/"
          cp start.sh "$pkg_name/"
          cp setup.bat "$pkg_name/"
          cp start.bat "$pkg_name/"
          cp .env.example "$pkg_name/"
          cp config.json.example "$pkg_name/"
          cp README.md "$pkg_name/"

          chmod +x "$pkg_name/setup.sh" "$pkg_name/start.sh"

          tar -czf "dist/${pkg_name}.tar.gz" "$pkg_name"
          zip -r "dist/${pkg_name}.zip" "$pkg_name"

          echo "Simulation packages created:"
          ls -lh dist/drosophila-brain*

      - name: Prepare Release Notes
        shell: bash
        run: |
          ver="${{ steps.vars.outputs.version_number }}"
          sed "s/__VERSION__/${ver}/g" .github/release-notes-template.md > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.vars.outputs.release_tag }}"
          title="${{ steps.vars.outputs.release_title }}"

          prerelease_flag=""
          if [ "${{ steps.vars.outputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
            gh release upload "$tag" dist/* --clobber
          else
            echo "Creating new release $tag..."
            gh release create "$tag" dist/* \
              --title "$title" \
              --notes-file release-notes.md \
              $prerelease_flag
          fi
